<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e6e6e6;
    }

    header {
        padding: 10px 20px;
        border-bottom: 2px solid #000;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    nav {
        margin-top: 10px;
    }

    nav a {
        display: inline-block;
        background: #2d6cdf;
        color: white;
        padding: 5px 10px;
        margin-right: 5px;
        text-decoration: none;
        font-size: 14px;
    }

    .hero {
        text-align: center;
        padding: 60px 20px;
        background: #d9d9d9;
    }

    .hero h2 {
        margin: 0;
        font-size: 24px;
    }

    .hero p {
        margin-top: 10px;
        font-size: 14px;
    }
</style>

<body>

<header>
    <h1>Навчальний центр</h1>
    <nav>
        <a href="#">Головна</a>
        <a href="#">Про нас</a>
        <a href="#">Курси</a>
    </nav>
</header>

<section class="hero">
    <h2>Вчись сучасним технологіям</h2>
    <p>HTML, CSS, JavaScript, jQuery</p>
</section>


</body>
</html>
